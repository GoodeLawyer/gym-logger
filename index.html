<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2646A6">
<title>KG Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column — sticky bar (tabs, date, save status), then one card per exercise. Progress tab reuses the column. */
:root{
  --bg:#EDEFEB; --surface:#FFFFFF; --field:#F5F6F3; --ink:#17201B; --muted:#5D6862; --line:#D3D9D2;
  --accent:#2646A6; --accent-ink:#FFFFFF; --wu:#2A76B3; --hint:#7A4E00; --hint-bg:#FFF1D2;
  --good:#1D7444; --bad:#B23628;
  --display:'Archivo Narrow','Arial Narrow',Arial,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1311; --surface:#171D1A; --field:#101512; --ink:#E6ECE8; --muted:#95A29A; --line:#29322D;
  --accent:#86A2FF; --accent-ink:#0C1430; --wu:#74B6EA; --hint:#F3C66E; --hint-bg:#352A12;
  --good:#5DCB8C; --bad:#F2857A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#171D1A; --field:#101512; --ink:#E6ECE8; --muted:#95A29A; --line:#29322D;
  --accent:#86A2FF; --accent-ink:#0C1430; --wu:#74B6EA; --hint:#F3C66E; --hint-bg:#352A12;
  --good:#5DCB8C; --bad:#F2857A; color-scheme:dark;}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 48px;}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 22px/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.tabs{display:flex;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:2px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.daterow{display:flex;align-items:center;gap:8px}
.daterow .nav{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:18px;line-height:1}
.daterow .d{flex:1;min-width:0;font-weight:600}
.todaybtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px}
.status{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.status.ok{color:var(--good)} .status.err{color:var(--bad)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.focus{font:700 28px/1.05 var(--display);text-transform:uppercase;margin:18px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
.card.hasdata{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exname{font-weight:700;font-size:16px}
.target{font:600 13px var(--mono);color:var(--muted);white-space:nowrap}
.hint{background:var(--hint-bg);color:var(--hint);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px;font-size:13px}
.hint .t{flex:1;min-width:0}
.hint b{font:600 15px var(--mono)}
.hint .why{display:block;opacity:.85;font-size:12px;margin-top:2px}
.hint button{border:1px solid currentColor;background:none;color:var(--hint);border-radius:6px;padding:5px 10px;font-weight:700;font-size:12px}
.nohist{font-size:12px;color:var(--muted)}
.setrow{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:center}
.setrow.one{grid-template-columns:52px 1fr}
.lbl{font:600 12px var(--mono);color:var(--muted);text-transform:uppercase}
.lbl.wu{color:var(--wu)}
.inp{position:relative;min-width:0}
.inp input{width:100%;height:44px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:0 40px 0 12px;font:600 17px var(--mono)}
.inp input::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent);font-weight:500}
.inp span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.toggle{height:44px;border:1px dashed var(--line);background:var(--field);border-radius:8px;font-weight:600;color:var(--muted);width:100%}
.toggle[aria-pressed="true"]{border:1px solid var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.daily{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daily label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.banner{border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
.loading{color:var(--muted);padding:24px 0;text-align:center}
/* progress */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font:600 24px/1.15 var(--mono);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
h2{font:700 18px var(--display);text-transform:uppercase;margin:24px 0 8px;letter-spacing:.02em}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px 4px}
.chart svg{display:block;width:100%;height:auto}
select{width:100%;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 10px;font:inherit;margin-bottom:8px}
.recent{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.recent button{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.recent button:last-child{border-bottom:0}
.recent .r{color:var(--muted);font:500 12px var(--mono);white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:14px}
.wrap.wide{max-width:1080px}
.setrow{grid-template-columns:44px 1fr 1fr 44px}
.setrow.one{grid-template-columns:44px 1fr 44px}
.chk{height:44px;border:1px solid var(--line);background:var(--field);border-radius:8px;font-weight:700;font-size:17px;color:var(--muted)}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.swap{justify-self:start;border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:0}
.note{width:100%;height:34px;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:0 10px;font:13px var(--body)}
.pr{display:inline-block;margin-left:8px;font:700 11px var(--mono);color:var(--surface);background:var(--good);border-radius:4px;padding:2px 5px;vertical-align:2px}
.hint.stall{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.hint.stall button{color:var(--bad)}
.daily{grid-template-columns:1fr 1fr}
.daily .full{grid-column:1/-1}
.kpi .v.small{font-size:18px}
.pubar{height:8px;background:var(--field);border:1px solid var(--line);border-radius:999px;margin:8px 0 6px;overflow:hidden}
.pubar span{display:block;height:100%;background:var(--accent)}
.pgrid{display:grid;gap:4px}
.pgrid section{min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted);margin:6px 2px 0}
.legend span{display:inline-block;margin-right:4px;vertical-align:middle}
.legend .ln{width:16px;height:3px;background:var(--accent);border-radius:2px}
.legend .dt{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.6}
.legend .gl{width:16px;border-top:2px dashed var(--good)}
@media (min-width:900px){.wrap.wide .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.pgrid{grid-template-columns:1fr 1fr;column-gap:20px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <div class="top">
      <h1>KG Gym Log</h1>
      <div class="tabs" role="group" aria-label="View">
        <button id="tabLog" aria-pressed="true">Log</button>
        <button id="tabProg" aria-pressed="false">Progress</button>
      </div>
    </div>
    <div class="daterow" id="dateRow">
      <button class="nav" id="prev" aria-label="Previous day">‹</button>
      <div class="d" id="dateLbl"></div>
      <button class="todaybtn" id="todayBtn" hidden>Today</button>
      <span class="status" id="status">Loading…</span>
      <button class="nav" id="next" aria-label="Next day">›</button>
    </div>
    <div class="days" id="days" role="group" aria-label="Workout day"></div>
  </div>
  <main id="log"><div class="loading">Loading your log…</div></main>
  <main id="prog" hidden></main>
</div>

<script>
// ---------- Program ----------
// [name, sets, target, warmup, mode]  mode: undefined = weight×reps, 'bw' reps only, 'carry' weight×yards, 'toggle', 'cardio' (incline+min), 'mins'
const CORE_A = [['Floor Crunch',3,'15',0,'bw'],['Hanging Knee Raise',3,'10',0,'bw'],['Back Extension',3,'12',0]];
const PLAN = {
  1:['Chest + Triceps',[
    ['Incline Press (Machine)',3,'8-10',1],['Chest Press (Machine)',3,'10',1],['Cable Chest Fly',3,'12-15',0],
    ['Triceps Rope Pushdown',3,'12',0],['Overhead Cable Triceps Extension',2,'12',0], ...CORE_A]],
  2:['Back + Biceps + Forearms',[
    ['Lat Pulldown',3,'10',1],['Chest-Supported Row',3,'10',1],['Dumbbell Curl',3,'10',0],
    ['Hammer Curl',3,'12',0],['Reverse EZ-Bar Curl',2,'15',0],['Wrist Curls',2,'20',0],
    ["Farmer's Carry",2,'40 yd',0,'carry'],['Machine Crunch',3,'12',0],['Dead Bug',3,'10',0,'bw']]],
  3:['Legs + Long Stretch',[
    ['Leg Press',3,'10',1],['DB Romanian Deadlift',3,'10',1],['Leg Curl',3,'12',0],
    ['Leg Extension',3,'12',0],['Standing Calf Raise',3,'15',0],['Pancake Stretch Session',1,'20 min',0,'toggle']]],
  4:['Shoulders + Chest',[
    ['Shoulder Press (Machine)',3,'10',1],['Lateral Raise',3,'12-15',0],['Incline Press (Machine)',3,'10',1],
    ['Low-to-High Cable Fly',3,'12',0],['Rear Delt Fly',3,'15',0], ...CORE_A]],
  5:['Arms + Conditioning',[
    ['Dumbbell Curl',3,'12',0],['Triceps Rope Pushdown',3,'12',0],['Hammer Curl',3,'12',0],
    ['Reverse EZ-Bar Curl',2,'15',0],['Wrist Curls',2,'20',0],["Farmer's Carry",2,'40 yd',0,'carry'],
    ['Incline Treadmill Walk',1,'20 min · 12% · 3.0 mph',0,'cardio']]],
  6:['Recovery',[['Walk',1,'8–10k steps',0,'mins']]],
  0:['Recovery + Weigh-In',[['Easy Walk',1,'30–45 min',0,'cardio']]],
};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const GOAL={weight:175,date:'2027-04-15'};
function step(name){
  if(/Leg Press/.test(name)) return 10;
  if(/Triceps|Overhead|Low-to-High/.test(name)) return 2.5;
  return 5;
}

// ---------- Helpers ----------
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pdate(s);d.setDate(d.getDate()+n);return iso(d)};
const fmtShort=s=>pdate(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtLong=s=>pdate(s).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null};
const fmtW=w=>w==null?'':(Math.round(w*10)/10).toString();
const round5=w=>Math.max(0,Math.round(w/5)*5);
const topReps=t=>{const m=String(t).match(/(\d+)(?!.*\d)/);return m?Number(m[1]):0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function workSets(e){return ((e&&e.sets)||[]).filter(x=>x&&(x.w!=null||x.r!=null))}
function hasData(doc){
  if(!doc||!doc.ex) return false;
  return Object.values(doc.ex).some(e=>workSets(e).length||e.done||e.min!=null||e.inc!=null);
}
function trained(doc){
  if(!doc||!doc.ex) return false;
  return Object.entries(doc.ex).some(([n,e])=>n!=='100 Pushups'&&n!=='Pushup Test'&&workSets(e).length) || (doc.plan>=1&&doc.plan<=5&&hasData(doc));
}

// ---------- State ----------
let TODAY=iso(new Date());
let ready=false, localOnly=false;
let sessions={};            // date -> doc (from the store)
let curDate=TODAY, cur=null;
let dirty=false, saving=false, saveTimer=null, lastSaved=null;
let tab='log', liftSel=null;

function blank(date){return {date,plan:pdate(date).getDay(),bw:null,stretch:false,ex:{}}}
function stashKey(d){return 'kglog-pending-'+d}
function stash(){try{localStorage.setItem(stashKey(cur.date),JSON.stringify(cur))}catch(e){}}
function readStash(d){try{const v=localStorage.getItem(stashKey(d));return v?JSON.parse(v):null}catch(e){return null}}
function clearStash(d,updated){try{const s=readStash(d);if(s&&s.updated===updated)localStorage.removeItem(stashKey(d))}catch(e){}}

function loadCur(){
  const s=sessions[curDate], st=readStash(curDate);
  let base=s?JSON.parse(JSON.stringify(s)):blank(curDate);
  if(st&&(!s||(st.updated||0)>(s.updated||0))){base=st; dirty=true; scheduleSave(200);} // unsaved edits from a dropped connection
  if(!base.ex) base.ex={};
  if(base.plan==null) base.plan=pdate(curDate).getDay();
  cur=base;
}

// ---------- Saving (Google Sheet via Apps Script) ----------
const API='https://script.google.com/macros/s/AKfycby4Hi0Z6c3nfcDmmn7vdFWC61zyp45hDGseTGwhG5qgGx8T8TkZmcR1EWy6xY-s7o8Y/exec';
let TOKEN=''; try{TOKEN=localStorage.getItem('kglog-key')||''}catch(e){}
async function apiList(){
  const r=await fetch(API+'?t='+encodeURIComponent(TOKEN)+'&_='+Date.now());
  const j=await r.json(); if(!j||j.error) throw new Error((j&&j.error)||'load failed'); return j.sessions||[];
}
async function apiSave(doc){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({t:TOKEN,doc})});
  const j=await r.json(); if(!j||!j.ok) throw new Error((j&&j.error)||'save failed');
}
function setStatus(kind){
  const el=$('status'); el.className='status';
  if(kind==='saving'){el.textContent='Saving…'}
  else if(kind==='saved'){el.textContent='Saved ✓'; el.classList.add('ok')}
  else if(kind==='retry'){el.textContent='Offline — will sync'; el.classList.add('err')}
  else if(kind==='idle'){el.textContent='Synced ✓'; el.classList.add('ok')}
  else el.textContent=kind;
}
function scheduleSave(ms){clearTimeout(saveTimer); saveTimer=setTimeout(flush,ms)}
function changed(){
  dirty=true; cur.updated=Date.now(); cur.src='app'; stash();
  setStatus('saving'); scheduleSave(700);
  markCards();
}
function cacheAll(){try{localStorage.setItem('kglog-cache',JSON.stringify(sessions))}catch(e){}}
async function flush(){
  if(!dirty) return;
  if(saving){scheduleSave(500); return}
  saving=true; dirty=false;
  const body=JSON.parse(JSON.stringify(cur));
  try{
    await apiSave(body);
    sessions[body.date]=body; cacheAll(); clearStash(body.date,body.updated); lastSaved=Date.now(); localOnly=false;
    setStatus(dirty?'saving':'saved');
  }catch(e){
    dirty=true; localOnly=true; setStatus('retry'); scheduleSave(8000);
  }finally{saving=false}
}
async function pushStashes(){
  // send edits that were made offline (any date) once the connection is back
  let keys=[]; try{keys=Object.keys(localStorage).filter(k=>k.startsWith('kglog-pending-'))}catch(e){}
  for(const k of keys){
    const st=readStash(k.slice('kglog-pending-'.length)); if(!st) continue;
    if(cur&&st.date===cur.date) continue; // current day is handled by flush()
    const srv=sessions[st.date];
    if(srv&&(srv.updated||0)>=(st.updated||0)){clearStash(st.date,st.updated); continue}
    try{await apiSave(st); sessions[st.date]=st; clearStash(st.date,st.updated)}catch(e){return}
  }
  cacheAll();
}
async function switchDate(d){
  clearTimeout(saveTimer); await flush();
  curDate=d; loadCur(); renderAll();
}
// ---------- Swaps (machine taken → alternative) ----------
const ALT={
  'Incline Press (Machine)':['Incline DB Press'],'Chest Press (Machine)':['DB Bench Press'],'Cable Chest Fly':['Pec Deck'],
  'Triceps Rope Pushdown':['Triceps Bar Pushdown'],'Overhead Cable Triceps Extension':['DB Overhead Extension'],
  'Lat Pulldown':['Assisted Pull-up'],'Chest-Supported Row':['Seated Cable Row'],'Dumbbell Curl':['Cable Curl'],
  'Hammer Curl':['Rope Hammer Curl'],'Leg Press':['Hack Squat','Goblet Squat'],'DB Romanian Deadlift':['Barbell RDL'],
  'Leg Curl':['Lying Leg Curl'],'Standing Calf Raise':['Seated Calf Raise'],'Shoulder Press (Machine)':['DB Shoulder Press'],
  'Lateral Raise':['Cable Lateral Raise'],'Low-to-High Cable Fly':['Incline DB Fly'],'Rear Delt Fly':['Face Pull'],
  'Back Extension':['Glute Bridge']
};
function activeDef(def){const sw=cur&&cur.swap&&cur.swap[def[0]]; return sw?[sw,...def.slice(1)]:def}
const roundTo=(v,st)=>Math.max(0,Math.round(v/st)*st);
const topW=e=>Math.max(0,...workSets(e).map(x=>x.w||0));

// ---------- Suggested weight ----------
function priorEntries(name){
  return Object.values(sessions).filter(s=>s.date<curDate&&s.ex&&s.ex[name]&&workSets(s.ex[name]).length)
    .sort((a,b)=>a.date<b.date?1:-1).map(s=>({date:s.date,e:s.ex[name]}));
}
function priorBest(name){return Math.max(0,...priorEntries(name).map(x=>topW(x.e)))}
function carriedNote(name){
  const docs=Object.values(sessions).filter(s=>s.date<curDate&&s.ex&&s.ex[name]&&s.ex[name].note).sort((a,b)=>a.date<b.date?1:-1);
  return docs.length?docs[0].ex[name].note:'';
}
function suggest(def){
  const [name,n,target,,mode]=def;
  const h=priorEntries(name);
  if(!h.length) return null;
  const last=h[0], ws=workSets(last.e), hi=topReps(target);
  const reps=ws.map(x=>x.r==null?'?':x.r);
  if(mode==='bw'){
    const allHit=ws.length>=n&&ws.every(x=>(x.r||0)>=hi);
    return {bw:true,last,lastTxt:reps.join(', ')+' reps',why:allHit?'Hit '+hi+' on every set — add 2–3 reps or slow the tempo.':'Aim for '+hi+' on every set.'};
  }
  const top=topW(last.e);
  const best=Math.max(...h.map(x=>topW(x.e)));
  const hitAll=(e,t)=>{const s=workSets(e); return s.length>=n&&s.every(x=>(x.w||0)>=t&&(x.r||0)>=hi)};
  const allHit=hitAll(last.e,top);
  let w=top, why, stall=false;
  const st=step(name);
  if(top===0){why='Bodyweight last time. Hold a plate once '+hi+' reps feels easy.'}
  else if(allHit){w=top+st; why='You hit '+hi+(mode==='carry'?' yd':'')+' on every set last time — move up.'}
  else if(h.length>=3&&h.slice(0,3).every(x=>topW(x.e)===top&&!hitAll(x.e,top))){
    stall=true; w=roundTo(top*0.9,st);
    why='Stuck at '+fmtW(top)+' for 3 sessions. Drop to '+fmtW(w)+', hit '+hi+' on every set, then build back up.';
  }
  else if(ws.length>=n&&ws.every(x=>(x.r||0)>=hi)) why='Do all '+n+' sets at '+fmtW(top)+' before moving up.';
  else why='Stay here until all '+n+' sets reach '+hi+(mode==='carry'?' yd':'')+'.';
  let wuW=null;
  if(def[3]){

    wuW=lw&&top?roundTo(lw*w/top,5):round5(w*0.6);
  }
  const lastTxt=top===0?reps.join(', ')+' reps':ws.map(x=>fmtW(x.w)+'×'+(x.r==null?'?':x.r)).join(', ');
  return {w,wuW,best,last,lastTxt,why,stall};
}

const PU_KEY='100 Pushups', PU_TEST='Pushup Test', PU_START_COL=1, PU_DAYS=[0,3,5]; // Sun, Wed, Fri
const PU_TEST_AFTER=[2,4,5,6]; // exhaustion test after these weeks (6 = the 100 final test)
function puPlace(n,after){
  // where a test result puts you (weeks/columns from the guide); never sends you back past a block you've finished
  const col=(n,a,b)=>n<=a?1:(n<=b?2:3);
  if(after===6&&n>=100) return {done:true};
  if(n>=46) return {wk:6,col:col(n,50,60)};
  if(n>=31) return {wk:5,col:col(n,35,40)};

function puSets(wk,day,col){const d=PU[wk][day]; return {rest:d.rest,sets:d.c[col-1]}}
function puHit(p){

  const t=puSets(p.wk,p.day,p.col).sets, s=p.sets||[];
  return t.every((v,i)=>s[i]&&s[i].r!=null&&s[i].r>=v);

function puState(before){

  Object.values(sessions).filter(d=>d.date<before&&d.ex).sort((a,b)=>a.date<b.date?-1:1).forEach(d=>{
    const t=d.ex[PU_TEST], p=d.ex[PU_KEY];
    if(t&&t.sets&&t.sets[0]&&t.sets[0].r!=null){
      const r=t.sets[0].r; st.best=Math.max(st.best,r);
      const pl=puPlace(r,t.after||0);
      if(pl.done){st.done=true; st.test=null}
      else st={...st,wk:pl.wk,day:1,col:pl.col,test:null};
    }
    if(p&&p.wk&&(p.sets||[]).some(x=>x&&x.r!=null)){
      const last=(p.sets||[])[puSets(p.wk,p.day,p.col).sets.length-1]; if(last&&last.r!=null) st.best=Math.max(st.best,last.r);
      if(puHit(p)){
        if(p.day<3) st={...st,wk:p.wk,day:p.day+1,col:p.col};
        else if(PU_TEST_AFTER.includes(p.wk)) st={...st,wk:p.wk,day:3,col:p.col,test:{after:p.wk}};
        else st={...st,wk:p.wk+1,day:1,col:p.col};

}
function puToday(){

  if(st.done) return {mode:'done',st};

function niceTicks(lo,hi,count){

function lineChart(pts,opt){
  // pts: [{d:'YYYY-MM-DD', y}] main line; opt.dots: faint daily points
  const W=640,H=240,L=44,R=14,T=14,B=28;
  if(!pts.length) return '<div class="empty">Nothing logged yet.</div>';
  const dots=opt.dots||[];
  const xs=pts.concat(dots).map(p=>pdate(p.d).getTime());
  let x0=Math.min(...xs), x1=Math.max(...xs);
  if(opt.toDate) x1=Math.max(x1,pdate(opt.toDate).getTime());
  if(x1===x0){x0-=864e5*3; x1+=864e5*3}
  const ys=pts.concat(dots).map(p=>p.y).concat(opt.goal!=null?[opt.goal]:[]);
  let y0=Math.min(...ys), y1=Math.max(...ys); const padY=Math.max(opt.minPad||2,(y1-y0)*0.12); y0-=padY; y1+=padY;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}">`;
  niceTicks(y0,y1,4).forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${fmtW(v)}</text>`});
  const start=new Date(x0); let m=new Date(start.getFullYear(),start.getMonth()+1,1); const months=[];
  while(m.getTime()<=x1){months.push(new Date(m)); m=new Date(m.getFullYear(),m.getMonth()+1,1)}
  const every=Math.max(1,Math.ceil(months.length/6));
  months.forEach((d,k)=>{if(k%every) return; const x=X(d.getTime()); s+=`<line x1="${x}" x2="${x}" y1="${H-B}" y2="${H-B+4}" stroke="var(--muted)"/><text x="${x}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--body)">${d.toLocaleDateString(undefined,{month:'short'})}</text>`});
  if(opt.goal!=null){
    s+=`<line x1="${L}" x2="${W-R}" y1="${Y(opt.goal)}" y2="${Y(opt.goal)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${Y(opt.goal)-5}" text-anchor="end" font-size="11" fill="var(--good)" font-family="var(--body)" font-weight="600">Goal ${opt.goal}</text>`;
  }
  const lastP=pts[pts.length-1];
  if(opt.toDate&&opt.goal!=null){
    s+=`<line x1="${X(pdate(lastP.d).getTime())}" y1="${Y(lastP.y)}" x2="${X(pdate(opt.toDate).getTime())}" y2="${Y(opt.goal)}" stroke="var(--good)" stroke-opacity=".5" stroke-dasharray="2 4" stroke-width="1.5"/>`;
  }
  dots.forEach(p=>{s+=`<circle cx="${X(pdate(p.d).getTime())}" cy="${Y(p.y)}" r="2.5" fill="var(--muted)" fill-opacity=".45"><title>${fmtShort(p.d)}: ${fmtW(p.y)}</title></circle>`});
  const path=pts.map((p,k)=>(k?'L':'M')+X(pdate(p.d).getTime()).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  s+=`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(!dots.length) pts.forEach((p,k)=>{const last=k===pts.length-1; s+=`<circle cx="${X(pdate(p.d).getTime())}" cy="${Y(p.y)}" r="${last?4.5:2.5}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"><title>${fmtShort(p.d)}: ${fmtW(p.y)}</title></circle>`});
  else s+=`<circle cx="${X(pdate(lastP.d).getTime())}" cy="${Y(lastP.y)}" r="4.5" fill="var(--accent)"/>`;
  s+=`<text x="${X(pdate(lastP.d).getTime())}" y="${Y(lastP.y)-9}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" font-family="var(--mono)">${fmtW(lastP.y)}</text>`;
  return s+'</svg>';
}
function weekStart(s){const d=pdate(s); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return iso(d)}
function avg7(bws){
  // 7-day rolling average of the weigh-ins on or before each date
  return bws.map(p=>{const lo=addDays(p.d,-6); const w=bws.filter(q=>q.d>=lo&&q.d<=p.d); return {d:p.d,y:Math.round(w.reduce((a,q)=>a+q.y,0)/w.length*10)/10}});
}
function streak(){
  const has=d=>sessions[d]&&trained(sessions[d]);
  let d=TODAY, n=0; if(!has(d)) d=addDays(d,-1);
  for(let k=0;k<500;k++){
    const dow=pdate(d).getDay();
    if(has(d)) n++; else if(dow!==0&&dow!==6) break;   // weekends never break the streak
    d=addDays(d,-1);
  }
  return n;
}
function prList(docs){
  const best={}, out=[];
  docs.forEach(d=>Object.entries(d.ex||{}).forEach(([n,e])=>{
    const t=topW(e); if(!t) return;
    if(best[n]&&t>best[n]) out.push({d:d.date,n,w:t,prev:best[n]});
    if(!best[n]||t>best[n]) best[n]=t;
  }));
  return out.reverse().slice(0,6);
}
function renderProg(){
  const el=$('prog'); if(tab!=='prog') return;
  if(!ready){el.innerHTML='<div class="loading">Loading…</div>';return}
  const docs=Object.values(sessions).sort((a,b)=>a.date<b.date?-1:1);
  const bws=docs.filter(d=>d.bw!=null).map(d=>({d:d.date,y:d.bw}));
  const avg=avg7(bws), lastAvg=avg[avg.length-1], lastBw=bws[bws.length-1];
  const bfs=docs.filter(d=>d.bodyFat!=null).map(d=>({d:d.date,y:d.bodyFat})), lastBf=bfs[bfs.length-1];
  const wk=weekStart(TODAY), thisWeek=docs.filter(d=>d.date>=wk&&d.date<=TODAY&&trained(d)).length;
  const lastTrain=[...docs].reverse().find(trained);
  const weeksLeft=Math.max(0,(pdate(GOAL.date)-pdate(TODAY))/(7*864e5));
  let toGoal='—', toGoalSub='Log a morning weight to start';
  if(lastAvg){const left=lastAvg.y-GOAL.weight; toGoal=left>0?fmtW(Math.round(left*10)/10)+' lb':'Reached';
    toGoalSub=left>0?`${(left/Math.max(weeksLeft,1)).toFixed(1)} lb/week to hit 175 by Apr 15`:'At or under 175'}
  const stk=streak();
  let h=`<div class="kpis">
    <div class="kpi"><div class="k">Weight · 7-day avg</div><div class="v">${lastAvg?fmtW(lastAvg.y):'—'}</div><div class="s">${lastBw?'Last weigh-in '+fmtW(lastBw.y)+' on '+fmtShort(lastBw.d):'No weigh-ins yet'}</div></div>
    <div class="kpi"><div class="k">To 175</div><div class="v">${toGoal}</div><div class="s">${toGoalSub}</div></div>
    <div class="kpi"><div class="k">This week</div><div class="v">${thisWeek}/5</div><div class="s">Gym days since Monday</div></div>
    <div class="kpi"><div class="k">Streak</div><div class="v">${stk}</div><div class="s">${stk===1?'Gym day':'Gym days'} in a row · weekends don't break it</div></div>
    <div class="kpi"><div class="k">Body fat</div><div class="v">${lastBf?fmtW(lastBf.y)+'%':'—'}</div><div class="s">${lastBf?'Measured '+fmtShort(lastBf.d):'Log it on the Log tab when you measure'}</div></div>
    <div class="kpi"><div class="k">Last workout</div><div class="v small">${lastTrain?fmtShort(lastTrain.date):'—'}</div><div class="s">${lastTrain?esc(PLAN[lastTrain.plan][0]):'Nothing logged yet'}</div></div>
  </div><div class="pgrid">`;
  h+=`<section><h2>Body weight</h2><div class="chart">${lineChart(avg,{dots:bws,goal:GOAL.weight,toDate:GOAL.date,label:'7-day average body weight with daily weigh-ins and 175 lb goal'})}</div><p class="legend"><span class="ln"></span>7-day average <span class="dt"></span>Daily weigh-in <span class="gl"></span>Goal 175 by Apr 15</p></section>`;
  const lifts=new Set(); docs.forEach(d=>Object.entries(d.ex||{}).forEach(([n,e])=>{if(topW(e)>0) lifts.add(n)}));
  const liftArr=[...lifts].sort();
  if(!liftSel||!liftArr.includes(liftSel)) liftSel=liftArr.includes('Leg Press')?'Leg Press':liftArr[0];
  h+=`<section><h2>Strength</h2>`;
  if(liftArr.length){
    const pts=docs.filter(d=>d.ex&&d.ex[liftSel]).map(d=>({d:d.date,y:topW(d.ex[liftSel])})).filter(p=>p.y>0);
    h+=`<label for="liftSel" class="nohist">Top working weight per session</label><select id="liftSel">${liftArr.map(n=>`<option${n===liftSel?' selected':''}>${esc(n)}</option>`).join('')}</select><div class="chart">${lineChart(pts,{label:liftSel+' top working weight'})}</div>`;
  }else h+=`<div class="empty">Log a lift to see it here.</div>`;
  h+=`</section>`;
  {const ps=puState(addDays(TODAY,1)); const pct=Math.min(100,ps.best||0);
   h+=`<section><h2>100 Pushups</h2><div class="kpi"><div class="k">Best set</div><div class="v">${ps.best||'—'}<span class="s"> / 100</span></div><div class="pubar"><span style="width:${pct}%"></span></div><div class="s">${ps.done?'Goal reached.':ps.test?'Next: '+(ps.test.after===6?'final 100 test':'exhaustion test'):'Next: Week '+ps.wk+', Day '+ps.day+', Column '+ps.col} · Sun, Wed, Fri</div></div></section>`;}
  if(bfs.length>=2) h+=`<section><h2>Body fat</h2><div class="chart">${lineChart(bfs,{label:'Body fat percentage over time',minPad:1})}</div></section>`;
  const prs=prList(docs);
  h+=`<section><h2>Recent PRs</h2><div class="recent">${prs.length?prs.map(p=>`<button data-go="${p.d}"><span>${esc(p.n)}<br><span class="nohist">${fmtLong(p.d)}</span></span><span class="r">${fmtW(p.w)} lb · was ${fmtW(p.prev)}</span></button>`).join(''):'<div class="empty">Beat your best weight on any lift and it shows up here.</div>'}</div></section>`;
  const recent=[...docs].reverse().filter(d=>hasData(d)||d.bw!=null).slice(0,10);
  h+=`<section><h2>Recent days</h2><div class="recent">${recent.length?recent.map(d=>{
    const n=Object.values(d.ex||{}).filter(e=>workSets(e).length).length;
    return `<button data-go="${d.date}"><span>${fmtLong(d.date)}<br><span class="nohist">${esc(PLAN[d.plan]?PLAN[d.plan][0]:'')}</span></span><span class="r">${n?n+' lifts':''}${d.bw!=null?(n?' · ':'')+fmtW(d.bw)+' lb':''}</span></button>`}).join(''):'<div class="empty">Nothing logged yet.</div>'}</div></section>`;
  h+=`</div>`;
  el.innerHTML=h;
}
$('prog').addEventListener('change',ev=>{if(ev.target.id==='liftSel'){liftSel=ev.target.value; renderProg()}});
$('prog').addEventListener('click',ev=>{const b=ev.target.closest('button[data-go]'); if(b){setTab('log'); switchDate(b.dataset.go)}});

function setTab(t){
  tab=t; document.querySelector('.wrap').classList.toggle('wide',t==='prog'); $('tabLog').setAttribute('aria-pressed',t==='log'); $('tabProg').setAttribute('aria-pressed',t==='prog');
  $('log').hidden=t!=='log'; $('prog').hidden=t!=='prog'; $('dateRow').hidden=t!=='log';
  renderHeader(); if(t==='prog') renderProg();
}
$('tabLog').onclick=()=>setTab('log');
$('tabProg').onclick=()=>{clearTimeout(saveTimer); flush(); setTab('prog')};
function renderAll(){renderHeader(); renderLog(); renderProg()}
function editingHere(){const a=document.activeElement; return a&&a.tagName==='INPUT'&&$('log').contains(a)}

// ---------- Boot ----------
try{const c=JSON.parse(localStorage.getItem('kglog-cache')||'null'); if(c){sessions=c; ready=true}}catch(e){}
loadCur(); renderAll();
function showKey(){
  ready=true; setStatus('Not connected');
  $('log').innerHTML=`<div class="card" style="margin-top:16px"><div class="exname">Connect this device</div><p class="sub" style="margin:0">Enter your access code once. It stays saved on this device.</p><div class="inp"><input id="keyIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Access code"></div><button class="toggle" id="keyBtn" aria-pressed="true">Connect</button></div>`;
  $('keyBtn').onclick=()=>{const k=$('keyIn').value.trim(); if(!k) return; try{localStorage.setItem('kglog-key',k)}catch(e){} TOKEN=k; ready=false; $('log').innerHTML='<div class="loading">Loading your log…</div>'; sync();};
}
let syncing=false;
async function sync(){
  if(!TOKEN){showKey(); return}
  if(syncing) return; syncing=true;
  try{
    const rows=await apiList(); const next={}; rows.forEach(d=>{if(d&&d.date) next[d.date]=d});
    sessions=next; cacheAll(); localOnly=false;
    const first=!ready; ready=true;
    if(first||(!dirty&&!saving&&!editingHere())){
      const s=sessions[curDate];
      if(first||!cur||(s&&(s.updated||0)>(cur.updated||0))){loadCur(); renderLog(); renderHeader()}
    }
    renderProg();
    await pushStashes();
    if(!dirty&&!saving) setStatus('idle');
  }catch(e){
    if(e&&e.message==='denied'){try{localStorage.removeItem('kglog-key')}catch(x){} TOKEN=''; showKey(); return}
    if(!ready){ready=true; loadCur(); renderAll()}
    localOnly=true; setStatus('retry');
  }finally{syncing=false}
}
// New day while the app sat open in the background (iPhone home-screen apps resume without reloading): move Today forward.
async function rollDay(){
  const t=iso(new Date()); if(t===TODAY) return;
  const wasToday=curDate===TODAY; TODAY=t;
  if(wasToday){clearTimeout(saveTimer); await flush(); curDate=t; loadCur()}
  renderAll();
}
sync();
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){clearTimeout(saveTimer); flush()}
  else {await rollDay(); sync()}
});
window.addEventListener('pageshow',()=>{rollDay()});
setInterval(async()=>{await rollDay(); if(document.visibilityState==='visible'&&!dirty) sync()},90000);
</script>
